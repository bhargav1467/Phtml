<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact us</title>
</head>
<body>
    <section>
      <h2>Address</h2>
      <p>
        <strong> The Food Restaurant </strong>, <br>
        2/10, Main Street, <br>
        Near City Market, <br>
        Hyderabad, Telangana 500059 <br>
       </p>
       <a href="https://www.google.com/maps/search/?api=1&query=The+Food+Restaurant,+2/10+Main+Street,+Near+City+Market,+Hyderabad,+Telangana+500059" target="_blank">View on Google Maps</a>  
       
       <section>
         <p>Please give your're valuable feedback</p>
         <form action="thankyou.html" >
          <label for="name"> Name:  </label> <br>
          <input type="text" name="fname" id="name" placeholder="Enter Name"><br>
          <label for="email"> Email: </label><br>
          <input type="email" name="femail" id="email" placeholder="Enter E-mail "> <br>
          <input type="submit" value="submit">
         </form>
       </section>

       <span>
        <form action="thankyou.html">
        <ol>
          <li>
             <p>Rate our food on the scale of 1 to 5?</p>
             <input type="number" min="1" max="5" step="0.1">
          </li>
          <li>
            <p>Rate the ambience</p>
            <input type="number" min="1" max="5" step="0.1">
          </li>
          <li>
            <p>Rate the Service</p>
            <input type="number" min="1" max="5" step="0.1">
          </li>
          <li><p>Rate our Music?</p>
            <select>
              <option value="">-- Select a rating --</option>
              <option value="1">1</option>
              <option value="1.5">1.5</option>
              <option value="2">2</option>
              <option value="2.5">2.5</option>
              <option value="3">3</option>
              <option value="3.5">3.5</option>
              <option value="4">4</option>
              <option value="4.5">4.5</option>
              <option value="5">5</option>
            </select></li>
        </ol>
        <input type="submit" value="submit">
        </form>
       </span>

    </section>
</body>
</html>
